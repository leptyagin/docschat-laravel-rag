# Production override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-prod-environment: &prod-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY must be set}
  APP_URL: https://${DOMAIN:?DOMAIN must be set}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  SESSION_SECURE_COOKIE: "true"

x-prod-app: &prod-app
  <<: *logging
  image: docschat-app:prod
  build:
    context: .
    target: prod
  restart: unless-stopped
  env_file: .env
  environment: *prod-environment
  volumes: !override
    - app_storage:/app/storage/app

services:
  app:
    <<: *prod-app
    environment:
      <<: *prod-environment
      SERVER_NAME: ${DOMAIN:?DOMAIN must be set}
      RUN_MIGRATIONS: "true"
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - app_storage:/app/storage/app
      - caddy_data:/data/caddy
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "--resolve", "${DOMAIN}:443:127.0.0.1", "https://${DOMAIN}/up"]
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: *prod-app
    deploy:
      resources:
        limits:
          memory: 768M

  scheduler:
    <<: *prod-app
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    <<: *logging
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports: !reset []
    volumes: !override
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    <<: *logging
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  app_storage:
