# Production override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

x-prod-app: &prod-app
  image: docschat-app:prod
  build:
    context: .
    target: prod
  restart: unless-stopped
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_LEVEL: warning
  volumes: !override
    - app_storage:/app/storage/app

services:
  app:
    <<: *prod-app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
      SERVER_NAME: ${DOMAIN:?DOMAIN must be set}
      RUN_MIGRATIONS: "true"
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes: !override
      - app_storage:/app/storage/app
      - caddy_data:/data/caddy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--resolve", "${DOMAIN}:443:127.0.0.1", "https://${DOMAIN}/up"]
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: *prod-app
    deploy:
      resources:
        limits:
          memory: 768M

  scheduler:
    <<: *prod-app
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  app_storage:
